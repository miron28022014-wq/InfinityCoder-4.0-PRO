name: Build InfinityCoder Windows Installer

on:
  push:
    branches: [main]
    paths:
      - "repo/**"
      - ".github/workflows/blank.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  windows-installer:
    name: Build Windows NSIS installer
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: repo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: repo/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: repo/src-tauri -> repo/src-tauri/target

      - name: Verify desktop packaging inputs
        shell: pwsh
        run: |
          if (!(Test-Path "src-tauri/tauri.conf.json")) { throw "Tauri config is missing" }
          if (!(Test-Path "src-tauri/icons/icon.ico")) { throw "Windows icon is missing" }
          if (!(Test-Path "src-tauri/build.rs")) { throw "Tauri build.rs is missing" }
          Write-Host "Tauri config, build script and Windows icon are present."

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Install Rollup native binary for Windows
        run: npm install --no-save --package-lock=false --ignore-scripts @rollup/rollup-win32-x64-msvc@4.64.0

      - name: Type check (existing diagnostics are non-blocking)
        continue-on-error: true
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build frontend
        run: npm run build

      - name: Build Windows installer (NSIS)
        run: npm run tauri:build -- --bundles nsis

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: InfinityCoder-4.0-Windows-Setup
          path: repo/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
