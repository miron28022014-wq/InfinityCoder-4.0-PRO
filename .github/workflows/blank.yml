name: Build InfinityCoder Windows Installer

on:
  push:
    branches: [main]
    paths:
      - "repo/**"
      - ".github/workflows/blank.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  windows-installer:
    name: Build full Windows NSIS installer
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: repo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: repo/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: repo/src-tauri -> repo/src-tauri/target

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build complete Windows installer with Vulkan runtime
        shell: pwsh
        run: |
          & .\scripts\build-installer.ps1 -SkipInstall
          if ($LASTEXITCODE -ne 0) { throw "build-installer.ps1 failed with exit code $LASTEXITCODE" }

          $runtime = Get-Item ".\src-tauri\bin\llama-server-vulkan.exe" -ErrorAction Stop
          if ($runtime.Length -lt 1MB) { throw "Bundled llama-server runtime is missing or too small." }

          $installer = Get-ChildItem ".\release" -Filter "InfinityCoder-*-Setup.exe" |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if (-not $installer) { throw "NSIS installer was not produced." }
          if ($installer.Length -lt 50MB) {
            throw "Installer is only $([math]::Round($installer.Length / 1MB, 1)) MB. Expected the bundled Vulkan runtime; refusing to publish an incomplete package."
          }

          Write-Host "Verified installer: $($installer.FullName)"
          Write-Host "Installer size: $([math]::Round($installer.Length / 1MB, 1)) MB"

      - name: Upload complete Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: InfinityCoder-4.0-Windows-Full-Setup
          path: repo/release/InfinityCoder-*-Setup.exe
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
